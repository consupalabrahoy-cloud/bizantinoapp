<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector y Concordancia del Texto Bizantino</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gemini: {
              bg: '#0f172a',       /* Slate 900 */
              card: '#1e293b',     /* Slate 800 */
              border: '#334155',   /* Slate 700 */
              text: '#e2e8f0',     /* Slate 200 */
              muted: '#94a3b8',    /* Slate 400 */
              accent: '#38bdf8'    /* Sky 400 */
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Estilos personalizados mínimos para legibilidad bíblica */
    .greek-text {
      font-family: 'Times New Roman', Georgia, serif;
      font-size: 1.125rem; /* 18px */
      line-height: 1.75;
    }
  </style>
</head>
<body class="bg-gemini-bg text-gemini-text min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-gemini-border py-4 px-6 bg-gemini-bg sticky top-0 z-10">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <h1 class="text-base font-medium tracking-wide text-gemini-muted">
        Lector y Concordancia del Texto Bizantino
      </h1>
      <nav class="flex space-x-2 bg-gemini-card p-1 rounded-lg border border-gemini-border">
        <button id="tab-lector-btn" onclick="switchTab('lector')" class="px-4 py-1.5 text-sm rounded-md transition-colors bg-gemini-border text-white font-medium">
          Leer el NT
        </button>
        <button id="tab-concordancia-btn" onclick="switchTab('concordancia')" class="px-4 py-1.5 text-sm rounded-md transition-colors text-gemini-muted hover:text-white">
          Concordancia
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6">

    <!-- Pestaña 1: Leer el NT -->
    <section id="tab-lector" class="space-y-6">
      <div class="bg-gemini-card p-4 rounded-xl border border-gemini-border grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs text-gemini-muted mb-1">Libro</label>
          <select id="sel-libro" onchange="onLibroChange()" class="w-full bg-gemini-bg border border-gemini-border rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-gemini-accent">
            <option value="">Cargando...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gemini-muted mb-1">Capítulo</label>
          <select id="sel-capitulo" onchange="onCapituloChange()" class="w-full bg-gemini-bg border border-gemini-border rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-gemini-accent">
            <option value="">-</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gemini-muted mb-1">Desde</label>
          <select id="sel-desde" onchange="renderLectorText()" class="w-full bg-gemini-bg border border-gemini-border rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-gemini-accent">
            <option value="">-</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gemini-muted mb-1">Hasta</label>
          <select id="sel-hasta" onchange="renderLectorText()" class="w-full bg-gemini-bg border border-gemini-border rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-gemini-accent">
            <option value="">-</option>
          </select>
        </div>
      </div>

      <!-- Barra de acciones y resultado del Lector -->
      <div id="lector-actions" class="hidden flex justify-end space-x-2">
        <button onclick="copiarTextoLector()" class="px-3 py-1 text-xs border border-gemini-border rounded bg-gemini-card hover:bg-gemini-border transition-colors text-gemini-muted hover:text-white">
          Copiar
        </button>
        <button onclick="limpiarLector()" class="px-3 py-1 text-xs border border-gemini-border rounded bg-gemini-card hover:bg-gemini-border transition-colors text-gemini-muted hover:text-white">
          Limpiar
        </button>
      </div>

      <div id="lector-out" class="greek-text space-y-2 text-gemini-text"></div>
    </section>

    <!-- Pestaña 2: Concordancia -->
    <section id="tab-concordancia" class="hidden space-y-6">
      <div class="bg-gemini-card p-4 rounded-xl border border-gemini-border space-y-4">
        <div>
          <input type="text" id="conc-input" placeholder="Pegar palabra o secuencia..." onkeyup="if(event.key==='Enter') buscarConcordancia()" class="w-full bg-gemini-bg border border-gemini-border rounded-md px-4 py-2 text-sm focus:outline-none focus:border-gemini-accent text-gemini-text placeholder-gemini-muted">
        </div>
        
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center space-x-6 text-sm">
            <label class="inline-flex items-center cursor-pointer">
              <input type="radio" name="search-mode" value="estricta" checked class="text-gemini-accent focus:ring-0">
              <span class="ml-2 text-gemini-text">Estricta</span>
            </label>
            <label class="inline-flex items-center cursor-pointer">
              <input type="radio" name="search-mode" value="flexible" class="text-gemini-accent focus:ring-0">
              <span class="ml-2 text-gemini-text">Flexible</span>
            </label>
          </div>

          <div class="flex space-x-2">
            <button onclick="buscarConcordancia()" class="px-4 py-1.5 text-xs bg-gemini-accent text-slate-900 font-medium rounded hover:opacity-90 transition-opacity">
              Buscar
            </button>
            <button onclick="copiarTextoConcordancia()" class="px-3 py-1.5 text-xs border border-gemini-border rounded bg-gemini-bg hover:bg-gemini-border transition-colors text-gemini-muted hover:text-white">
              Copiar
            </button>
            <button onclick="limpiarConcordancia()" class="px-3 py-1.5 text-xs border border-gemini-border rounded bg-gemini-bg hover:bg-gemini-border transition-colors text-gemini-muted hover:text-white">
              Limpiar
            </button>
          </div>
        </div>
      </div>

      <div id="conc-info" class="text-xs text-gemini-muted px-1"></div>
      <div id="conc-out" class="greek-text space-y-3 text-gemini-text"></div>
    </section>

  </main>

  <!-- Footer discreto -->
  <footer class="border-t border-gemini-border py-3 px-6 text-center text-xs text-gemini-muted">
    Versión 1.0
  </footer>

  <!-- Script principal -->
  <script>
    let dbData = [];
    let estructura = {};

    // Cargar datos
    window.addEventListener('DOMContentLoaded', () => {
      fetch('bizantino.json')
        .then(res => res.json())
        .then(data => {
          dbData = data;
          procesarEstructura();
          poblarLibros();
        })
        .catch(err => console.error("Error al cargar bizantino.json:", err));

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    });

    // Cambiar de pestañas
    function switchTab(tab) {
      const lectorTab = document.getElementById('tab-lector');
      const concTab = document.getElementById('tab-concordancia');
      const lectorBtn = document.getElementById('tab-lector-btn');
      const concBtn = document.getElementById('tab-concordancia-btn');

      if (tab === 'lector') {
        lectorTab.classList.remove('hidden');
        concTab.classList.add('hidden');
        lectorBtn.className = "px-4 py-1.5 text-sm rounded-md transition-colors bg-gemini-border text-white font-medium";
        concBtn.className = "px-4 py-1.5 text-sm rounded-md transition-colors text-gemini-muted hover:text-white";
      } else {
        lectorTab.classList.add('hidden');
        concTab.classList.remove('hidden');
        concBtn.className = "px-4 py-1.5 text-sm rounded-md transition-colors bg-gemini-border text-white font-medium";
        lectorBtn.className = "px-4 py-1.5 text-sm rounded-md transition-colors text-gemini-muted hover:text-white";
      }
    }

    // Organizar estructura de Libros y Capítulos
    function procesarEstructura() {
      estructura = {};
      dbData.forEach(item => {
        const partes = item.encabezado.split(" ");
        const cap = parseInt(partes.pop(), 10);
        const libro = partes.join(" ");

        if (!estructura[libro]) estructura[libro] = {};
        if (!estructura[libro][cap]) estructura[libro][cap] = [];
        
        estructura[libro][cap].push(parseInt(item.versiculo, 10));
      });
    }

    function poblarLibros() {
      const selLibro = document.getElementById('sel-libro');
      selLibro.innerHTML = '<option value="">-- Seleccionar --</option>';
      Object.keys(estructura).forEach(libro => {
        const opt = document.createElement('option');
        opt.value = libro;
        opt.textContent = libro;
        selLibro.appendChild(opt);
      });
      limpiarLector();
    }

    function onLibroChange() {
      const libro = document.getElementById('sel-libro').value;
      const selCap = document.getElementById('sel-capitulo');
      selCap.innerHTML = '<option value="">-</option>';
      document.getElementById('sel-desde').innerHTML = '<option value="">-</option>';
      document.getElementById('sel-hasta').innerHTML = '<option value="">-</option>';
      document.getElementById('lector-out').innerHTML = '';
      document.getElementById('lector-actions').classList.add('hidden');

      if (!libro || !estructura[libro]) return;

      Object.keys(estructura[libro]).sort((a,b)=>a-b).forEach(cap => {
        const opt = document.createElement('option');
        opt.value = cap;
        opt.textContent = cap;
        selCap.appendChild(opt);
      });
    }

    function onCapituloChange() {
      const libro = document.getElementById('sel-libro').value;
      const cap = document.getElementById('sel-capitulo').value;
      const selDesde = document.getElementById('sel-desde');
      const selHasta = document.getElementById('sel-hasta');

      selDesde.innerHTML = '<option value="">-</option>';
      selHasta.innerHTML = '<option value="">-</option>';
      document.getElementById('lector-out').innerHTML = '';
      document.getElementById('lector-actions').classList.add('hidden');

      if (!libro || !cap || !estructura[libro][cap]) return;

      const versiculos = estructura[libro][cap].sort((a,b)=>a-b);
      versiculos.forEach(v => {
        const opt1 = document.createElement('option');
        opt1.value = v;
        opt1.textContent = v;
        selDesde.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = v;
        opt2.textContent = v;
        selHasta.appendChild(opt2);
      });

      if (versiculos.length > 0) {
        selDesde.value = versiculos[0];
        selHasta.value = versiculos[versiculos.length - 1];
        renderLectorText();
      }
    }

    function renderLectorText() {
      const libro = document.getElementById('sel-libro').value;
      const cap = document.getElementById('sel-capitulo').value;
      const desde = parseInt(document.getElementById('sel-desde').value, 10);
      const hasta = parseInt(document.getElementById('sel-hasta').value, 10);
      const out = document.getElementById('lector-out');
      const actions = document.getElementById('lector-actions');

      if (!libro || !cap || isNaN(desde) || isNaN(hasta)) {
        out.innerHTML = '';
        actions.classList.add('hidden');
        return;
      }

      const min = Math.min(desde, hasta);
      const max = Math.max(desde, hasta);
      const targetEnc = `${libro} ${cap}`;

      const filtrados = dbData.filter(item => {
        if (item.encabezado !== targetEnc) return false;
        const v = parseInt(item.versiculo, 10);
        return v >= min && v <= max;
      });

      if (filtrados.length === 0) {
        out.innerHTML = '';
        actions.classList.add('hidden');
        return;
      }

      out.innerHTML = filtrados.map(item => `
        <div class="py-0.5">
          <span class="text-gemini-accent font-sans text-xs mr-2 font-semibold select-none">${item.versiculo}</span>
          <span>${item.texto_griego}</span>
        </div>
      `).join('');

      actions.classList.remove('hidden');
    }

    function copiarTextoLector() {
      const out = document.getElementById('lector-out');
      if (!out.innerText) return;
      navigator.clipboard.writeText(out.innerText);
    }

    function limpiarLector() {
      document.getElementById('sel-libro').value = '';
      document.getElementById('sel-capitulo').innerHTML = '<option value="">-</option>';
      document.getElementById('sel-desde').innerHTML = '<option value="">-</option>';
      document.getElementById('sel-hasta').innerHTML = '<option value="">-</option>';
      document.getElementById('lector-out').innerHTML = '';
      document.getElementById('lector-actions').classList.add('hidden');
    }

    // Lógica de Concordancia
    function buscarConcordancia() {
      const query = document.getElementById('conc-input').value.trim().toLowerCase();
      const modo = document.querySelector('input[name="search-mode"]:checked').value;
      const out = document.getElementById('conc-out');
      const info = document.getElementById('conc-info');

      if (!query) {
        out.innerHTML = '';
        info.innerHTML = '';
        return;
      }

      const resultados = [];

      dbData.forEach(item => {
        const texto = item.texto_griego.toLowerCase();

        if (modo === 'estricta') {
          // Búsqueda exact de secuencia/palabra completa
          const regex = new RegExp(`(?:^|\\s)${escapeRegExp(query)}(?:$|\\s)`, 'i');
          if (regex.test(texto) || texto.includes(query)) {
            resultados.push({
              pasaje: `${item.encabezado}:${item.versiculo}`,
              texto: item.texto_griego
            });
          }
        } else {
          // Búsqueda flexible (palabra que comienza con la secuencia)
          const palabras = texto.split(/\s+/);
          const coincidentes = palabras.filter(p => p.startsWith(query));
          if (coincidentes.length > 0) {
            // Eliminar duplicados en el mismo versículo
            const unicas = [...new Set(coincidentes)];
            resultados.push({
              pasaje: `${item.encabezado}:${item.versiculo}`,
              coincidencias: unicas.join(', '),
              texto: item.texto_griego
            });
          }
        }
      });

      info.textContent = `Apariciones encontradas: ${resultados.length}`;

      if (resultados.length === 0) {
        out.innerHTML = '<div class="text-sm text-gemini-muted font-sans py-4">No se encontraron coincidencias.</div>';
        return;
      }

      if (modo === 'estricta') {
        out.innerHTML = resultados.map(r => `
          <div class="py-1 border-b border-gemini-border/50 last:border-0">
            <span class="text-gemini-accent font-sans text-xs font-semibold block sm:inline mr-2">${r.pasaje}</span>
            <span>${r.texto}</span>
          </div>
        `).join('');
      } else {
        out.innerHTML = resultados.map(r => `
          <div class="py-1 border-b border-gemini-border/50 last:border-0">
            <div class="font-sans text-xs mb-1">
              <span class="text-gemini-accent font-semibold mr-2">${r.pasaje}</span>
              <span class="text-gemini-muted bg-gemini-card px-2 py-0.5 rounded border border-gemini-border">[${r.coincidencias}]</span>
            </div>
            <span>${r.texto}</span>
          </div>
        `).join('');
      }
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function copiarTextoConcordancia() {
      const out = document.getElementById('conc-out');
      if (!out.innerText) return;
      navigator.clipboard.writeText(out.innerText);
    }

    function limpiarConcordancia() {
      document.getElementById('conc-input').value = '';
      document.getElementById('conc-out').innerHTML = '';
      document.getElementById('conc-info').innerHTML = '';
    }
  </script>
</body>
</html>
